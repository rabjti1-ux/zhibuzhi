name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zbz.jks"
            echo "ZBZ_KEYSTORE=$RUNNER_TEMP/zbz.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret found. Building a debug APK that must be uninstalled before each update."
          fi
      - name: Build
        run: |
          chmod +x gradlew
          if [ -n "$ZBZ_KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk zhibuzhi.apk
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk zhibuzhi.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zhibuzhi-apk
          path: zhibuzhi.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: zhibuzhi build ${{ github.run_number }}
          files: zhibuzhi.apk
          make_latest: true
